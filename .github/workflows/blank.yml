name: Ubuntu Tailscale SSH

on:
  workflow_dispatch:

jobs:
  ubuntu-ssh:
    runs-on: ubuntu-latest
    timeout-minutes: 3600

    steps:
      - name: Update & Install Dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y curl ufw openssh-server

      - name: Configure SSH
        run: |
          # Ensure SSH server is enabled and running
          sudo systemctl enable ssh
          sudo systemctl start ssh

          # Open SSH port in firewall
          sudo ufw allow 22/tcp
          sudo ufw --force enable

      - name: Create SSH User with Secure Password
        run: |
          # Generate random password
          PASSWORD=$(openssl rand -base64 16)
          sudo useradd -m -s /bin/bash sshuser
          echo "sshuser:$PASSWORD" | sudo chpasswd
          sudo usermod -aG sudo,adm sshuser
          
          echo "SSH_CREDS=User: sshuser | Password: $PASSWORD" >> $GITHUB_ENV

      - name: Install Tailscale
        run: |
          curl -fsSL https://tailscale.com/install.sh | sh

      - name: Connect Tailscale
        run: |
          sudo tailscale up --authkey=${{ secrets.TAILSCALE_AUTH_KEY }} --hostname=gh-runner-$GITHUB_RUN_ID
          
          # Wait until Tailscale assigns an IP
          for i in {1..10}; do
            TS_IP=$(tailscale ip -4)
            if [ -n "$TS_IP" ]; then
              break
            fi
            sleep 5
          done
          
          if [ -z "$TS_IP" ]; then
            echo "Tailscale IP not assigned"
            exit 1
          fi
          echo "TAILSCALE_IP=$TS_IP" >> $GITHUB_ENV

      - name: Verify SSH Connectivity
        run: |
          echo "Tailscale IP: $TAILSCALE_IP"
          nc -zv $TAILSCALE_IP 22 || (echo "SSH port not reachable" && exit 1)
          echo "SSH port reachable!"

      - name: Maintain Connection
        run: |
          echo "=== SSH ACCESS INFO ==="
          echo "Address: $TAILSCALE_IP"
          echo "Username: sshuser"
          echo "Password: $SSH_CREDS"
          echo "======================="
          
          # Keep the workflow alive
          while true; do
            echo "[$(date)] SSH over Tailscale active..."
            sleep 300
          done
