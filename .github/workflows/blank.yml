name: Ubuntu Tailscale RDP/SSH

on:
  workflow_dispatch:

jobs:
  secure-ubuntu:
    runs-on: ubuntu-latest
    timeout-minutes: 3600

    steps:
      - name: Update & Install Dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y curl ufw xrdp

      - name: Configure xRDP (for GUI)
        run: |
          sudo systemctl enable xrdp
          sudo systemctl start xrdp

      - name: Open Firewall for RDP
        run: |
          sudo ufw allow 3389/tcp
          sudo ufw --force enable

      - name: Create User with Secure Password
        run: |
          # Generate random password
          PASSWORD=$(openssl rand -base64 16)
          sudo useradd -m -s /bin/bash rdpuser
          echo "rdpuser:$PASSWORD" | sudo chpasswd
          sudo usermod -aG sudo,adm rdpuser
          
          echo "RDP_CREDS=User: rdpuser | Password: $PASSWORD" >> $GITHUB_ENV

      - name: Install Tailscale
        run: |
          curl -fsSL https://tailscale.com/install.sh | sh

      - name: Connect Tailscale
        run: |
          sudo tailscale up --authkey=${{ secrets.TAILSCALE_AUTH_KEY }} --hostname=gh-runner-$GITHUB_RUN_ID
          # Wait until Tailscale assigns an IP
          for i in {1..10}; do
            TS_IP=$(tailscale ip -4)
            if [ -n "$TS_IP" ]; then
              break
            fi
            sleep 5
          done
          if [ -z "$TS_IP" ]; then
            echo "Tailscale IP not assigned"
            exit 1
          fi
          echo "TAILSCALE_IP=$TS_IP" >> $GITHUB_ENV

      - name: Verify Connectivity
        run: |
          echo "Tailscale IP: $TAILSCALE_IP"
          nc -zv $TAILSCALE_IP 3389 || (echo "RDP port not reachable" && exit 1)
          echo "RDP/SSH port reachable!"

      - name: Maintain Connection
        run: |
          echo "=== ACCESS INFO ==="
          echo "Address: $TAILSCALE_IP"
          echo "Username: rdpuser"
          echo "Password: $RDP_CREDS"
          echo "=================="
          # Keep the job alive indefinitely
          while true; do
            echo "[$(date)] Connection active..."
            sleep 300
          done
